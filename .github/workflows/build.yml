name: Build Cloudstream Plugins

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Plugins
        run: ./gradlew makePlugins

      - name: Deploy to builds branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Collect all compiled .cs3 files into a temporary folder outside git tracking temporarily
          mkdir -p plugin_output
          find . -name "*.cs3" -exec cp {} plugin_output/ \;

          # Switch to an orphan builds branch
          git checkout --orphan builds
          git rm -rf .

          # Copy back the compiled .cs3 plugins
          cp plugin_output/* .
          rm -rf plugin_output

          # Stage and commit the .cs3 files
          git add *.cs3
          git commit -m "Update plugin builds [skip ci]" || echo "No changes to commit"
          
          # Push to the builds branch
          git push origin builds --force
