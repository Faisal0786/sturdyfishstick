name: Build Cloudstream Plugins

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Plugins and Generate Manifests
        run: ./gradlew make

      - name: Deploy to builds branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create an orphan builds branch
          git checkout --orphan builds
          git rm -rf .
          
          # Move generated .cs3 files and JSON manifests to the root directory
          find . -name "*.cs3" -exec mv {} . \;
          find . -name "plugins.json" -exec mv {} . \;
          find . -name "repo.json" -exec mv {} . \;
          
          # Stage, commit, and force-push artifacts
          git add *.cs3 plugins.json repo.json 2>/dev/null || true
          git commit -m "Auto-build plugins: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push origin builds --force
